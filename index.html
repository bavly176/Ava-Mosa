<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>افتح الباب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;600&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep: #090c12;
    --ink: #0d1119;
    --parchment: #e9e0c9;
    --parchment-dim: #b9ae90;
    --gold: #c9a24a;
    --gold-bright: #e8c877;
    --ember: #b5502a;
    --smoke: #565b52;
    --line: rgba(201,162,74,0.28);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: radial-gradient(ellipse at 50% 20%, #151a22 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color: var(--parchment);
    font-family: 'Cairo', sans-serif;
    overflow-x:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 18px;
    position:relative;
  }

  /* drifting incense-like haze */
  .haze{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(600px 300px at 20% 10%, rgba(201,162,74,0.05), transparent 60%),
      radial-gradient(500px 260px at 85% 85%, rgba(181,80,42,0.06), transparent 60%);
    z-index:0;
  }

  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:0.5;
  }
  .stars span{
    position:absolute;
    width:2px;height:2px;
    background: var(--gold);
    border-radius:50%;
    opacity:0.35;
    animation: twinkle 4.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15;}
    50%{opacity:0.7;}
  }

  .icon-frame{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    padding: 46px 34px 38px;
    background: linear-gradient(180deg, #12161f 0%, #0b0e14 100%);
    border: 1px solid var(--line);
    box-shadow:
      0 0 0 6px rgba(201,162,74,0.05),
      0 0 60px rgba(0,0,0,0.6),
      inset 0 0 40px rgba(201,162,74,0.04);
    text-align:center;
  }

  .icon-frame::before,
  .icon-frame::after{
    content:"";
    position:absolute;
    inset:8px;
    border: 1px solid var(--line);
    pointer-events:none;
  }
  .icon-frame::after{
    inset:13px;
    border-color: rgba(201,162,74,0.14);
  }

  .corner{
    position:absolute;
    width:20px;height:20px;
    border: 1px solid var(--gold);
    opacity:0.55;
  }
  .corner.tl{top:-1px;right:-1px;border-left:none;border-bottom:none;}
  .corner.tr{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .corner.bl{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .corner.br{bottom:-1px;left:-1px;border-right:none;border-top:none;}

  .cross{
    width:44px;
    height:56px;
    margin: 0 auto 20px;
    opacity:0.95;
    filter: drop-shadow(0 0 6px rgba(201,162,74,0.25));
  }
  .cross svg{ width:100%; height:100%; }

  .eyebrow{
    font-family:'Cinzel', serif;
    font-size:11px;
    letter-spacing:0.35em;
    color: var(--parchment-dim);
    margin-bottom:14px;
  }

  h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:30px;
    line-height:1.5;
    margin: 0 0 6px;
    color: var(--gold-bright);
    text-shadow: 0 0 24px rgba(232,200,119,0.18);
  }

  .sub{
    font-size:14.5px;
    color: var(--parchment-dim);
    line-height:1.9;
    margin: 0 0 30px;
    padding: 0 6px;
  }

  form{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  input[type="text"]{
    width:100%;
    background: rgba(233,224,201,0.03);
    border: 1px solid rgba(201,162,74,0.35);
    color: var(--parchment);
    font-family:'Cairo', sans-serif;
    font-size:16px;
    padding: 15px 16px;
    text-align:center;
    outline:none;
    transition: border-color .25s ease, box-shadow .25s ease, background .25s ease;
  }
  input[type="text"]::placeholder{
    color: rgba(185,174,144,0.55);
  }
  input[type="text"]:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,162,74,0.12);
    background: rgba(233,224,201,0.05);
  }

  button{
    margin-top:6px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    font-family:'Cinzel', serif;
    font-size:13px;
    letter-spacing:0.18em;
    padding: 14px 18px;
    cursor:pointer;
    transition: background .25s ease, color .25s ease, letter-spacing .25s ease;
  }
  button:hover{
    background: rgba(201,162,74,0.12);
    letter-spacing:0.24em;
  }
  button:active{
    background: rgba(201,162,74,0.22);
  }

  .msg{
    min-height: 20px;
    margin-top:16px;
    font-size:13.5px;
    line-height:1.8;
    transition: opacity .2s ease;
  }
  .msg.error{
    color:#c46a4a;
  }

  .shake{
    animation: shake .45s ease;
  }
  @keyframes shake{
    10%,90%{ transform: translateX(-2px); }
    20%,80%{ transform: translateX(4px); }
    30%,50%,70%{ transform: translateX(-7px); }
    40%,60%{ transform: translateX(7px); }
  }

  /* ---- success screen ---- */
  .revealed{
    display:none;
  }
  .revealed.show{
    display:block;
    animation: fadeIn .9s ease both;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .gate-open-label{
    font-family:'Cinzel', serif;
    font-size:12px;
    letter-spacing:0.3em;
    color: var(--gold-bright);
    margin-bottom: 18px;
  }

  .morse-box{
    direction:ltr;
    font-family: 'Courier New', monospace;
    font-size: 19px;
    letter-spacing: 3px;
    color: var(--gold-bright);
    background: rgba(201,162,74,0.06);
    border: 1px solid var(--line);
    padding: 22px 14px;
    margin: 6px 0 22px;
    word-break: break-word;
    line-height:2.1;
  }

  .final-line{
    font-family:'Aref Ruqaa', serif;
    font-size:16px;
    color: var(--parchment);
    line-height:2;
    opacity:0.9;
  }

  /* celebration */
  .burst{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
    opacity:0;
  }
  .burst.play{
    animation: burstFade 1.8s ease forwards;
  }
  @keyframes burstFade{
    0%{opacity:0;}
    15%{opacity:1;}
    100%{opacity:0;}
  }
  .spark{
    position:absolute;
    top:50%; left:50%;
    width:3px; height:3px;
    background: var(--gold-bright);
    border-radius:50%;
    box-shadow: 0 0 8px 2px rgba(232,200,119,0.8);
  }

  .flash{
    position:fixed;
    inset:0;
    background: radial-gradient(circle at 50% 45%, rgba(232,200,119,0.35), transparent 60%);
    opacity:0;
    pointer-events:none;
    z-index:4;
  }
  .flash.play{
    animation: flashPulse 1.1s ease forwards;
  }
  @keyframes flashPulse{
    0%{opacity:0;}
    12%{opacity:1;}
    100%{opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }

  @media (max-width:420px){
    h1{ font-size:25px; }
    .icon-frame{ padding: 38px 22px 30px; }
    .morse-box{ font-size:16px; letter-spacing:2px; }
  }
</style>
</head>
<body>

<div class="haze"></div>
<div class="stars" id="stars"></div>
<div class="flash" id="flash"></div>
<div class="burst" id="burst"></div>

<div class="stage">
  <div class="icon-frame">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <!-- GATE VIEW -->
    <div id="gateView">
      <div class="cross">
        <svg viewBox="0 0 44 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 3 V53 M7 18 H37" stroke="#c9a24a" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="eyebrow">Open the gate</div>
      <h1>من يعرف السر يدخل<br>ومن لا يعرفه فلا مكان له</h1>

      <form id="gateForm" autocomplete="off">
        <input type="text" id="pass" placeholder="اكتب السر هنا" />
        <button type="submit">ادخل</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <!-- REVEALED VIEW -->
    <div class="revealed" id="revealedView">
      <div class="cross">
        <svg viewBox="0 0 44 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 3 V53 M7 18 H37" stroke="#e8c877" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="gate-open-label">Open the gate</div>
      <h1>عرفتَ السرّ</h1>
      <div class="morse-box">-... .. --- / .. -. ... - .- --. .-. .- -- /</div>
      <p class="final-line">يلا فك الشفرة وكمّل.. شكلك انت اللي هتاخد ال٥٠٠ جنيه</p>
    </div>

  </div>
</div>

<script>
  // starfield
  (function(){
    const wrap = document.getElementById('stars');
    const n = 40;
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      s.style.top = Math.random()*100+'%';
      s.style.left = Math.random()*100+'%';
      s.style.animationDelay = (Math.random()*4)+'s';
      wrap.appendChild(s);
    }
  })();

  // normalize arabic text: strip tashkeel, unify alef/ya forms, remove tatweel & extra spaces
  function normalizeAr(str){
    return str
      .replace(/[\u064B-\u0652\u0670\u0640]/g,'')      // tashkeel + tatweel
      .replace(/[إأآا]/g,'ا')
      .replace(/ى/g,'ي')
      .replace(/ة/g,'ه')
      .replace(/\s+/g,' ')
      .trim()
      .toLowerCase();
  }

  const accepted = [
    'الانبا موسي الاسود',
    'القديس الانبا موسي الاسود',
    'القوي الانبا موسي الاسود',
    'موسي الاسود'
  ].map(normalizeAr);

  const form = document.getElementById('gateForm');
  const input = document.getElementById('pass');
  const msg = document.getElementById('msg');
  const frame = document.querySelector('.icon-frame');
  const gateView = document.getElementById('gateView');
  const revealedView = document.getElementById('revealedView');
  const flash = document.getElementById('flash');
  const burst = document.getElementById('burst');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const val = normalizeAr(input.value);

    if(accepted.includes(val)){
      celebrateAndReveal();
    } else {
      msg.textContent = 'متبقاش عجول.. استنى البوست التاني وركّز فيه أوي';
      msg.classList.add('error');
      frame.classList.remove('shake');
      void frame.offsetWidth;
      frame.classList.add('shake');
      input.value = '';
    }
  });

  function celebrateAndReveal(){
    // build sparks
    burst.innerHTML = '';
    const count = 26;
    for(let i=0;i<count;i++){
      const sp = document.createElement('div');
      sp.className = 'spark';
      const angle = (Math.PI*2*i)/count;
      const dist = 120 + Math.random()*160;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;
      sp.style.transform = 'translate(0,0)';
      sp.style.transition = 'transform 1.1s cubic-bezier(.2,.7,.3,1), opacity 1.1s ease';
      burst.appendChild(sp);
      requestAnimationFrame(()=>{
        sp.style.transform = `translate(${dx}px, ${dy}px)`;
        sp.style.opacity = '0';
      });
    }

    flash.classList.add('play');
    burst.classList.add('play');

    setTimeout(()=>{
      gateView.style.display = 'none';
      revealedView.classList.add('show');
    }, 550);
  }

  input.addEventListener('input', ()=>{
    msg.textContent = '';
  });
</script>

</body>
</html>
